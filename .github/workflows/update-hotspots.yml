name: update-hotspots
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成/追加当日热点
        env:
          TZ: Asia/Shanghai
        run: node hotspot-gen/update-daily.mjs

      - name: 提交并推送
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "hotspot-bot"
          git config user.email "actions@github.com"
          git add hotspots/data/hotspots.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: $(date +%F) 每日热点更新"
            git push
          fi
